name: Notify Homebrew Tap

on:
  release:
    types: [published]

jobs:
  notify-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Get DMG SHA256
        id: sha256
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          DMG_URL="https://github.com/jameslockman/Griffin-PowerMate-Driver/releases/download/${VERSION}/PowerMateAgent-${VERSION}.dmg"

          # Wait briefly for the release asset to be fully available
          sleep 10

          SHA256=$(curl -sL "${DMG_URL}" | shasum -a 256 | awk '{print $1}')
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Trigger tap update
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.TAP_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jameslockman/homebrew-tap/dispatches \
            -d '{
              "event_type": "new-release",
              "client_payload": {
                "version": "${{ steps.sha256.outputs.version }}",
                "sha256": "${{ steps.sha256.outputs.sha256 }}"
              }
            }'
